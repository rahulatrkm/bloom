<style>
  :root{
    --ink:#f4f6ff; --dim:#9aa3c0; --faint:#6b7392;
    --panel:rgba(16,18,32,.82); --line:rgba(255,255,255,.10);
    --gold:#ffd479;
  }
  *,*::before,*::after{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
  html,body{height:100%; overflow:hidden; background:#05060d}
  body{
    font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    color:var(--ink); user-select:none; -webkit-font-smoothing:antialiased;
    touch-action:manipulation;
  }
  canvas{display:block; width:100vw; height:100dvh}

  /* ---------- HUD ---------- */
  #hud{
    position:fixed; top:0; left:0; right:0; z-index:5; pointer-events:none;
    padding:max(18px,env(safe-area-inset-top)) 20px 0;
    display:flex; align-items:flex-start; justify-content:space-between;
    opacity:0; transition:opacity .4s ease;
  }
  #hud.on{opacity:1}
  .stat{font-variant-numeric:tabular-nums}
  .stat .k{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); font-weight:600}
  .stat .v{font-size:22px; font-weight:600; letter-spacing:-.02em; line-height:1.15}
  .stat.right{text-align:right}
  #goalWrap{position:fixed; top:max(18px,env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    z-index:5; text-align:center; pointer-events:none; opacity:0; transition:opacity .4s ease}
  #goalWrap.on{opacity:1}
  #goalTxt{font-size:12px; color:var(--dim); letter-spacing:.03em}
  #goalTxt b{color:var(--ink); font-variant-numeric:tabular-nums}
  #bar{width:132px; height:3px; margin:7px auto 0; background:rgba(255,255,255,.10); border-radius:3px; overflow:hidden}
  #bar i{display:block; height:100%; width:0; border-radius:3px;
    background:linear-gradient(90deg,#60a5fa,#c084fc); transition:width .35s cubic-bezier(.22,1,.36,1)}

  /* ---------- overlays ---------- */
  .veil{
    position:fixed; inset:0; z-index:10; display:grid; place-items:center; padding:26px;
    background:radial-gradient(ellipse at 50% 40%, rgba(30,25,70,.55), rgba(5,6,13,.92) 70%);
    backdrop-filter:blur(3px);
    opacity:0; pointer-events:none; transition:opacity .45s ease;
  }
  .veil.on{opacity:1; pointer-events:auto}
  .sheet{width:100%; max-width:390px; text-align:center;
    transform:translateY(14px) scale(.985); opacity:0;
    transition:transform .5s cubic-bezier(.22,1,.36,1), opacity .5s ease}
  .veil.on .sheet{transform:none; opacity:1}

  .logo{font-size:clamp(3rem,13vw,4.4rem); font-weight:250; letter-spacing:.24em;
    text-indent:.24em; line-height:1;
    background:linear-gradient(180deg,#fff 10%,#8ab4ff 55%,#c084fc 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 26px rgba(130,160,255,.35))}
  .tagline{color:var(--dim); font-size:14.5px; margin-top:14px; line-height:1.6}
  .tagline b{color:var(--ink); font-weight:600}

  .cta{
    margin-top:30px; appearance:none; border:0; cursor:pointer; font:inherit;
    font-size:15px; font-weight:600; letter-spacing:.02em; color:#0a0b14;
    background:linear-gradient(180deg,#eaf0ff,#b9c8f0);
    padding:14px 40px; border-radius:999px;
    box-shadow:0 8px 30px -8px rgba(150,180,255,.5);
    transition:transform .16s cubic-bezier(.22,1,.36,1), box-shadow .16s;
  }
  .cta:hover{transform:translateY(-2px); box-shadow:0 14px 38px -10px rgba(150,180,255,.62)}
  .cta:active{transform:translateY(0) scale(.98)}
  .ghost{margin-top:14px; appearance:none; background:none; border:0; cursor:pointer; font:inherit;
    color:var(--faint); font-size:13px; letter-spacing:.02em; transition:color .18s}
  .ghost:hover{color:var(--ink)}

  .hint{margin-top:26px; color:var(--faint); font-size:12px; letter-spacing:.04em}

  /* results */
  .verdict{font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--faint); font-weight:600}
  .bignum{font-size:clamp(3.4rem,16vw,5rem); font-weight:250; letter-spacing:-.03em; line-height:1;
    margin:6px 0 2px; font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,#fff,#9fb6ff);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
  .sub{color:var(--dim); font-size:14px}
  .stars{display:flex; gap:10px; justify-content:center; margin:20px 0 4px}
  .star{width:26px; height:26px; opacity:.16; transform:scale(.7); transition:.42s cubic-bezier(.34,1.56,.64,1)}
  .star.lit{opacity:1; transform:none; filter:drop-shadow(0 0 10px rgba(255,212,121,.65))}
  .rowstats{display:flex; justify-content:center; gap:30px; margin-top:22px}
  .rowstats div{text-align:center}
  .rowstats .k{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); font-weight:600}
  .rowstats .v{font-size:19px; font-weight:600; font-variant-numeric:tabular-nums; margin-top:3px}

  #toast{position:fixed; left:50%; bottom:46px; transform:translate(-50%,14px); z-index:20;
    background:var(--panel); border:1px solid var(--line); color:var(--ink);
    padding:11px 20px; border-radius:999px; font-size:13.5px; font-weight:550;
    opacity:0; transition:.3s cubic-bezier(.22,1,.36,1); backdrop-filter:blur(10px)}
  #toast.on{opacity:1; transform:translate(-50%,0)}

  @media (prefers-reduced-motion: reduce){ *{transition-duration:.01ms!important} }

<body>
<h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">Bloom — a one-tap puzzle about chain reactions</h1>
<canvas id="c" aria-label="Bloom game board"></canvas>

<div id="hud">
  <div class="stat"><div class="k">Level</div><div class="v" id="hLevel">1</div></div>
  <div class="stat right"><div class="k">Score</div><div class="v" id="hScore">0</div></div>
</div>
<div id="goalWrap">
  <div id="goalTxt">catch <b id="gNeed">1</b> of <b id="gTotal">6</b></div>
  <div id="bar"><i id="barFill"></i></div>
</div>

<div class="veil on" id="vStart">
  <div class="sheet">
    <div class="logo">BLOOM</div>
    <p class="tagline">One tap sets off a cascade of light.<br/><b>Time it well.</b> Every orb you catch spreads the bloom.</p>
    <button class="cta" id="btnPlay">Begin</button>
    <button class="ghost" id="btnHow">How it works</button>
    <p class="hint" id="bestHint"></p>
  </div>
</div>

<div class="veil" id="vEnd">
  <div class="sheet">
    <div class="verdict" id="eVerdict">Level complete</div>
    <div class="bignum" id="eCaught">0</div>
    <div class="sub" id="eSub">orbs caught</div>
    <div class="stars" id="eStars"></div>
    <div class="rowstats">
      <div><div class="k">Score</div><div class="v" id="eScore">0</div></div>
      <div><div class="k">Best chain</div><div class="v" id="eChain">0</div></div>
      <div><div class="k">Level</div><div class="v" id="eLevel">1</div></div>
    </div>
    <button class="cta" id="btnNext">Continue</button>
    <button class="ghost" id="btnShare">Share result</button>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";

/* =========================================================================
   Bloom — a chain-reaction game.
   Tap once. Your bloom expands, lingers, fades. Any orb it touches blooms
   too. The whole game is choosing the single best moment to tap.
   ========================================================================= */

const cv = document.getElementById("c");
const ctx = cv.getContext("2d", { alpha: false });
const $ = id => document.getElementById(id);

let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize); resize();

/* ---------------- palette ----------------
   Hues chosen to sit together; each orb keeps a stable hue so the board
   reads as one composition rather than confetti. */
const HUES = [206, 224, 268, 288, 320, 178];
const hsl = (h, s, l, a = 1) => `hsla(${h},${s}%,${l}%,${a})`;

/* ---------------- easing ---------------- */
const easeOutCubic  = t => 1 - Math.pow(1 - t, 3);
const easeOutQuint  = t => 1 - Math.pow(1 - t, 5);
const easeInOutSine = t => -(Math.cos(Math.PI * t) - 1) / 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------------- audio: a pentatonic ladder so chains sound musical ---- */
let AC = null, muted = false;
const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28, 31, 33, 36];
function actx(){ if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); return AC; }
function note(step, { gain = .12, dur = .55, type = "sine", detune = 0 } = {}){
  if(muted) return;
  try{
    const a = actx(), t = a.currentTime;
    const semis = SCALE[Math.min(step, SCALE.length - 1)];
    const freq = 261.63 * Math.pow(2, semis / 12);
    const o = a.createOscillator(), g = a.createGain(), o2 = a.createOscillator();
    const filt = a.createBiquadFilter();
    filt.type = "lowpass"; filt.frequency.value = 2600;
    o.type = type; o.frequency.value = freq; o.detune.value = detune;
    o2.type = "triangle"; o2.frequency.value = freq * 2; o2.detune.value = detune + 6;
    const g2 = a.createGain(); g2.gain.value = .25;
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(filt); filt.connect(a.destination);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.start(t); o2.start(t); o.stop(t + dur); o2.stop(t + dur);
  }catch(e){ /* audio is a bonus, never a blocker */ }
}
function thud(){
  if(muted) return;
  try{
    const a = actx(), t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(46, t + .34);
    g.gain.setValueAtTime(.2, t); g.gain.exponentialRampToValueAtTime(.0001, t + .36);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + .36);
  }catch(e){}
}

/* ---------------- game state ---------------- */
const S = {
  phase: "menu",          // menu | aiming | resolving | done
  level: 1, score: 0, caught: 0, need: 1, total: 6, reach: 78,
  bestChain: 0, chainDepth: 0,
  orbs: [], blooms: [], sparks: [], pops: [],
  shake: 0, slowmo: 1, flash: 0,
  t: 0, settleAt: 0,
};

const BEST_KEY = "bloom_best_v2";
const loadBest = () => { try{ return JSON.parse(localStorage.getItem(BEST_KEY) || "{}"); }catch(e){ return {}; } };
const saveBest = b => { try{ localStorage.setItem(BEST_KEY, JSON.stringify(b)); }catch(e){} };

/* Difficulty design.

   A chain game lives or dies on one number: how many orbs a single bloom
   is expected to touch. Call it the branching factor. Below 1 the chain
   fizzles no matter how well you tap; far above 1 every tap sweeps the
   board. Just under/around 1 it is pure coin-flip. So the radius is
   DERIVED from orb density rather than hand-picked in pixels:

       expected neighbours = total * PI * r^2 / screenArea
   =>  r = sqrt(target * screenArea / (total * PI))

   This also fixes a real portability bug: a fixed pixel radius makes the
   game trivially easy on a phone and near-impossible on a desktop, since
   the same orb count spreads over 4x the area. Deriving from area keeps
   the feel identical on every screen.

   Difficulty then comes from lowering the target (tighter timing needed)
   and raising the quota as a FRACTION of the board — never from simply
   adding orbs, which makes a chain game easier, not harder. */
function levelPlan(n){
  const k      = Math.min(n - 1, 24);
  const total  = Math.min(6 + Math.round((n - 1) * 2.4), 52);
  const target = 1.28 - k * 0.0105;                      // L1 1.28 -> L25 1.03
  const area   = Math.max(W * H, 120000);
  const rawR   = Math.sqrt(target * area / (total * Math.PI));
  const reach  = clamp(rawR, 30, Math.min(W, H) * 0.17);
  // achievable catch-rate climbs steeply then plateaus, so the quota has to
  // be concave too; a straight line leaves the mid-game impossible to lose
  const frac   = 0.28 + 0.528 * Math.sqrt(k / 24);       // L1 .28 -> L25 .81
  // level 1 is the first impression: a well-aimed tap must never fail it
  const need   = n === 1 ? 1 : Math.max(1, Math.min(Math.round(total * frac), total));
  return { total, need, reach };
}

function makeOrb(){
  const r = 7 + Math.random() * 5;
  const speed = (0.28 + Math.random() * 0.42) * (1 + S.level * 0.028);
  const ang = Math.random() * Math.PI * 2;
  return {
    x: 40 + Math.random() * (W - 80),
    y: 40 + Math.random() * (H - 80),
    vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
    r, baseR: r,
    hue: HUES[(Math.random() * HUES.length) | 0],
    phase: Math.random() * Math.PI * 2,
    alive: true, blooming: false,
  };
}

function startLevel(n){
  const plan = levelPlan(n);
  S.level = n; S.need = plan.need; S.total = plan.total; S.reach = plan.reach;
  S.caught = 0; S.chainDepth = 0; S.bestChain = 0;
  S.orbs = Array.from({ length: plan.total }, makeOrb);
  S.blooms = []; S.sparks = []; S.pops = [];
  S.phase = "aiming"; S.shake = 0; S.slowmo = 1;
  $("hud").classList.add("on"); $("goalWrap").classList.add("on");
  $("hLevel").textContent = n; $("hScore").textContent = S.score;
  $("gNeed").textContent = plan.need; $("gTotal").textContent = plan.total;
  $("barFill").style.width = "0%";
  hide("vStart"); hide("vEnd");
  toast(`Level ${n} — catch ${plan.need} of ${plan.total}`);
}

/* ---------------- blooms & chain ---------------- */
function addBloom(x, y, hue, depth){
  S.blooms.push({
    x, y, hue, depth,
    age: 0,
    grow: 34,                    // frames to reach full size
    hold: 46,                    // frames held open
    fade: 34,                    // frames to fade
    maxR: S.reach + Math.min(depth, 6) * 3,
    r: 0, alpha: 1,
  });
  note(Math.min(depth, SCALE.length - 1), { gain: .10, dur: .7 });
  S.chainDepth = Math.max(S.chainDepth, depth);
  S.bestChain = Math.max(S.bestChain, depth);
  burst(x, y, hue, 10 + Math.min(depth, 8) * 2);
  S.shake = Math.min(S.shake + 1.6 + depth * .2, 12);
  S.flash = Math.min(S.flash + .05 + depth * .006, .22);
}

function burst(x, y, hue, n){
  for(let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, sp = .6 + Math.random() * 2.6;
    S.sparks.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 1, decay: .012 + Math.random() * .018,
      r: .8 + Math.random() * 2, hue,
    });
  }
}

function popText(x, y, text, hue){
  S.pops.push({ x, y, text, hue, life: 1 });
}

/* ---------------- input ---------------- */
function tap(e){
  if(S.phase !== "aiming") return;
  const rect = cv.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  const x = p.clientX - rect.left, y = p.clientY - rect.top;
  S.phase = "resolving";
  thud();
  addBloom(x, y, 210, 0);
  S.settleAt = 0;
}
cv.addEventListener("pointerdown", e => { e.preventDefault(); actx(); tap(e); });

/* ---------------- update ---------------- */
function update(dt){
  S.t += dt;

  // orbs drift and gently pulse
  for(const o of S.orbs){
    if(!o.alive) continue;
    o.x += o.vx * dt * S.slowmo; o.y += o.vy * dt * S.slowmo;
    if(o.x < o.r){ o.x = o.r; o.vx *= -1; }
    if(o.x > W - o.r){ o.x = W - o.r; o.vx *= -1; }
    if(o.y < o.r){ o.y = o.r; o.vy *= -1; }
    if(o.y > H - o.r){ o.y = H - o.r; o.vy *= -1; }
    o.phase += dt * .05;
    o.r = o.baseR + Math.sin(o.phase) * 1.1;
  }

  // blooms grow, hold, fade — and catch orbs while open
  for(let i = S.blooms.length - 1; i >= 0; i--){
    const b = S.blooms[i];
    b.age += dt * S.slowmo;
    const { grow, hold, fade } = b;
    if(b.age <= grow){
      b.r = easeOutQuint(b.age / grow) * b.maxR; b.alpha = 1;
    }else if(b.age <= grow + hold){
      b.r = b.maxR + Math.sin((b.age - grow) * .12) * 2.2; b.alpha = 1;
    }else{
      const k = (b.age - grow - hold) / fade;
      b.r = b.maxR * (1 + k * .16);
      b.alpha = 1 - easeOutCubic(k);
      if(k >= 1){ S.blooms.splice(i, 1); continue; }
    }
    // collision only while the bloom is genuinely open
    if(b.alpha > .25){
      for(const o of S.orbs){
        if(!o.alive || o.blooming) continue;
        const dx = o.x - b.x, dy = o.y - b.y;
        if(dx * dx + dy * dy <= (b.r + o.r) * (b.r + o.r)){
          o.blooming = true; o.alive = false;
          S.caught++;
          const depth = b.depth + 1;
          const gain = 10 * depth;
          S.score += gain;
          popText(o.x, o.y, "+" + gain, o.hue);
          addBloom(o.x, o.y, o.hue, depth);
          $("hScore").textContent = S.score;
          $("barFill").style.width = Math.min(100, S.caught / S.need * 100) + "%";
          if(depth >= 4) S.slowmo = Math.min(S.slowmo, .55);
        }
      }
    }
  }

  // particles
  for(let i = S.sparks.length - 1; i >= 0; i--){
    const s = S.sparks[i];
    s.x += s.vx * dt * S.slowmo; s.y += s.vy * dt * S.slowmo;
    s.vx *= .985; s.vy *= .985; s.vy += .012 * dt;
    s.life -= s.decay * dt;
    if(s.life <= 0) S.sparks.splice(i, 1);
  }
  for(let i = S.pops.length - 1; i >= 0; i--){
    const p = S.pops[i];
    p.y -= .35 * dt; p.life -= .014 * dt;
    if(p.life <= 0) S.pops.splice(i, 1);
  }

  // recover from slow-motion and shake
  S.slowmo += (1 - S.slowmo) * .012 * dt;
  S.shake *= Math.pow(.90, dt);
  S.flash *= Math.pow(.88, dt);

  // level resolves once every bloom has faded
  if(S.phase === "resolving" && S.blooms.length === 0){
    S.settleAt += dt;
    if(S.settleAt > 18) finish();
  }
}

/* ---------------- render ---------------- */
function drawBackground(){
  // deep vertical wash plus a soft centre glow: cheap, and gives real depth
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#080a16"); g.addColorStop(.55, "#06070f"); g.addColorStop(1, "#04050b");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const rg = ctx.createRadialGradient(W * .5, H * .42, 0, W * .5, H * .42, Math.max(W, H) * .72);
  rg.addColorStop(0, "rgba(70,90,190,.14)"); rg.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
}

function drawOrb(o){
  const g = ctx.createRadialGradient(o.x - o.r * .3, o.y - o.r * .35, o.r * .12, o.x, o.y, o.r * 1.9);
  g.addColorStop(0, hsl(o.hue, 92, 86, .95));
  g.addColorStop(.45, hsl(o.hue, 84, 64, .72));
  g.addColorStop(1, hsl(o.hue, 80, 52, 0));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(o.x, o.y, o.r * 1.9, 0, 7); ctx.fill();

  ctx.fillStyle = hsl(o.hue, 96, 88, .96);
  ctx.beginPath(); ctx.arc(o.x, o.y, o.r * .52, 0, 7); ctx.fill();
}

function drawBloom(b){
  const ring = ctx.createRadialGradient(b.x, b.y, Math.max(0, b.r * .55), b.x, b.y, b.r);
  ring.addColorStop(0, hsl(b.hue, 90, 70, 0));
  ring.addColorStop(.72, hsl(b.hue, 92, 74, .16 * b.alpha));
  ring.addColorStop(.94, hsl(b.hue, 96, 82, .5 * b.alpha));
  ring.addColorStop(1, hsl(b.hue, 96, 90, 0));
  ctx.fillStyle = ring;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();

  ctx.strokeStyle = hsl(b.hue, 98, 88, .62 * b.alpha);
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.stroke();

  ctx.fillStyle = hsl(b.hue, 96, 92, .5 * b.alpha);
  ctx.beginPath(); ctx.arc(b.x, b.y, 2.6, 0, 7); ctx.fill();
}

function render(){
  ctx.save();
  if(S.shake > .1){
    const a = Math.random() * Math.PI * 2, m = S.shake * .5;
    ctx.translate(Math.cos(a) * m, Math.sin(a) * m);
  }
  drawBackground();

  ctx.globalCompositeOperation = "lighter";
  for(const s of S.sparks){
    ctx.fillStyle = hsl(s.hue, 96, 78, s.life * .85);
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r * (0.4 + s.life), 0, 7); ctx.fill();
  }
  for(const o of S.orbs) if(o.alive) drawOrb(o);
  for(const b of S.blooms) drawBloom(b);
  ctx.globalCompositeOperation = "source-over";

  for(const p of S.pops){
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.fillStyle = hsl(p.hue, 90, 84, 1);
    ctx.font = "600 15px ui-sans-serif,-apple-system,system-ui,sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(p.text, p.x, p.y);
    ctx.globalAlpha = 1;
  }

  if(S.flash > .002){
    ctx.fillStyle = `rgba(190,210,255,${S.flash})`;
    ctx.fillRect(0, 0, W, H);
  }

  // a quiet prompt so the first-time player knows what to do
  if(S.phase === "aiming"){
    const pulse = .5 + Math.sin(S.t * .05) * .22;
    ctx.fillStyle = `rgba(255,255,255,${.30 * pulse})`;
    ctx.font = "500 13px ui-sans-serif,-apple-system,system-ui,sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("tap anywhere to bloom", W / 2, H - 46);
  }
  ctx.restore();
}

/* ---------------- loop ---------------- */
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  // normalise to 60fps units so physics is frame-rate independent
  const dt = clamp((now - last) / 16.6667, 0, 3);
  last = now;
  try{
    if(S.phase === "aiming" || S.phase === "resolving") update(dt);
    render();
  }catch(err){ console.error(err); }
}
requestAnimationFrame(frame);

/* ---------------- flow ---------------- */
function stars(){
  const ratio = S.caught / S.need;
  return S.caught >= S.total ? 3 : ratio >= 1.5 ? 3 : ratio >= 1.15 ? 2 : ratio >= 1 ? 1 : 0;
}

function finish(){
  S.phase = "done";
  const won = S.caught >= S.need;
  const st = won ? Math.max(1, stars()) : 0;

  const best = loadBest();
  best.score = Math.max(best.score || 0, S.score);
  best.level = Math.max(best.level || 1, won ? S.level + 1 : S.level);
  best.chain = Math.max(best.chain || 0, S.bestChain);
  saveBest(best);

  $("eVerdict").textContent = won ? (st === 3 ? "Perfect bloom" : "Level complete") : "So close";
  $("eCaught").textContent = S.caught;
  $("eSub").textContent = won ? `of ${S.total} orbs caught` : `you needed ${S.need}`;
  $("eScore").textContent = S.score;
  $("eChain").textContent = S.bestChain;
  $("eLevel").textContent = S.level;
  $("btnNext").textContent = won ? "Next level" : "Try again";

  const wrap = $("eStars"); wrap.innerHTML = "";
  for(let i = 0; i < 3; i++){
    const s = document.createElement("span");
    s.className = "star";
    s.innerHTML = `<svg viewBox="0 0 24 24" fill="${i < st ? '#ffd479' : '#ffffff'}"><path d="M12 2.6l2.9 6.1 6.6.9-4.8 4.6 1.2 6.6L12 17.6 6.1 20.8l1.2-6.6L2.5 9.6l6.6-.9z"/></svg>`;
    wrap.appendChild(s);
    if(i < st) setTimeout(() => { s.classList.add("lit"); note(6 + i * 2, { gain: .1, dur: .5 }); }, 260 + i * 190);
  }

  $("hud").classList.remove("on"); $("goalWrap").classList.remove("on");
  show("vEnd");
}

const show = id => $(id).classList.add("on");
const hide = id => $(id).classList.remove("on");

let toastT = null;
function toast(msg){
  const el = $("toast"); el.textContent = msg; el.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("on"), 2100);
}

const dropFocus = () => { if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); };

$("btnPlay").addEventListener("click", () => { actx(); S.score = 0; startLevel(1); dropFocus(); });
$("btnHow").addEventListener("click", () => {
  toast("One tap. Each orb it catches blooms again — chain them.");
});
$("btnNext").addEventListener("click", () => {
  actx();
  const won = S.caught >= S.need;
  startLevel(won ? S.level + 1 : S.level);
  dropFocus();
});
$("btnShare").addEventListener("click", async () => {
  const txt = `Bloom — level ${S.level}, ${S.caught} orbs, chain ${S.bestChain}, ${S.score} pts\nhttps://rahulatrkm.github.io/bloom/`;
  try{
    if(navigator.share){ await navigator.share({ text: txt }); return; }
    await navigator.clipboard.writeText(txt); toast("Result copied");
  }catch(e){ toast("Could not share"); }
});

(function initMenu(){
  const b = loadBest();
  $("bestHint").textContent = b.score
    ? `best ${b.score} pts · reached level ${b.level} · chain ${b.chain}`
    : "no signup · plays instantly";
  // idle orbs behind the menu so the first frame is already alive
  S.orbs = Array.from({ length: 14 }, makeOrb);
})();
</script>
</body>
</html>
